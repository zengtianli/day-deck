name: day-deck
name_en: Notihub
name_zh: 通知复盘
display_name: Notihub · 通知复盘
family: notifhub
form: ios
platforms: [iphone, ipad, watch, vision]
lifecycle: active
bundle_id: cyou.tianli.daydeck
origin: own
sop:
  platforms:
    iphone:
      simulator: {device_type: iPhone-17-Pro}
      launch_args: [-demo, '1']
      store_shots: shots/appstore/iphone/*.png
      capture:
        command: ~/Dev/.venv/bin/python -B scripts/media/store_shots.py --platform iphone --reuse-build perf/builds/current-iphone-fixture.json --in-use
        in_use: true
        inputs: [scripts/media/store_shots.py, scripts/media/capture_admission.py, perf/builds/current-iphone-fixture.json]
        outputs: [shots/appstore/iphone]
      distribution: none
    ipad:
      simulator: {device_type: iPad-Pro-13-inch-M5-12GB}
      launch_args: [-demo, '1']
      orientation: landscape
      store_shots: shots/appstore/ipad/*.png
      capture:
        command: ~/Dev/.venv/bin/python -B scripts/media/store_shots.py --platform ipad --reuse-build perf/builds/current-iphone-fixture.json --single-session --in-use
        in_use: true
        inputs: [scripts/media/store_shots.py, scripts/media/capture_admission.py, perf/builds/current-iphone-fixture.json]
        outputs: [shots/appstore/ipad]
      distribution: none
    mac: {component: notifhub-bar-mac}
    watch:
      scheme: DayDeckWatch
      bundle_id: cyou.tianli.daydeck.watchkitapp
      simulator: {device_type: Apple-Watch-Series-12-46mm}
      launch_args: [-demo, '1']
      store_shots: shots/appstore/watch/*.png
      budget: {memory_mb: 25, cpu: 0.5, size_mb: 10, cold_launch_ms: 1500}
      distribution: none
    vision:
      simulator: {device_type: Apple-Vision-Pro-4K}
      launch_args: [-demo, '1']
      store_shots: shots/appstore/vision/*.png
      capture:
        command: ~/Dev/.venv/bin/python -B scripts/media/store_shots.py --platform vision --reuse-build perf/builds/current-vision-fixture.json --in-use
        in_use: true
        inputs: [scripts/media/store_shots.py, scripts/media/capture_admission.py, perf/builds/current-vision-fixture.json]
        outputs: [shots/appstore/vision]
      budget: {memory_mb: 60, cpu: 0.5}
      distribution: none
  # 2026-09-30 核实：仓库无 ci_scripts/.github，ASC 的 Xcode Cloud 产品里没有本 bundle；推送不触发构建上传
  push_safe: true
  accept:
    native_ui: ~/Dev/.venv/bin/python scripts/accept/native_ui.py
    product_basics: ~/Dev/.venv/bin/python scripts/accept/product_basics.py
    functionality: bash scripts/accept/functionality.sh
    recovery: bash scripts/accept/recovery.sh
    privacy: bash scripts/accept/privacy.sh
    media_playback: builtin:media_playback
  product_basics:
    schema_version: 1
    features:
      settings:
        entry: 连接 → 设置与更新 → 启动页面、配置导入导出
        readback: ~/Dev/.venv/bin/python scripts/accept/product_basics.py --status --udid <模拟器UUID>
      shortcuts:
        not_applicable: iPhone、iPad、Vision 为触屏或空间客户端，标签页、搜索和按钮承载操作，没有全局键盘监听或呼出；Watch 为宿主摘要，系统编辑快捷键继续由系统处理。
      icloud:
        entry: 连接 → 设置与更新 → 使用 iCloud 记住配置（默认关闭，仅启动页面）
        readback: ~/Dev/.venv/bin/python scripts/accept/product_basics.py --status --udid <模拟器UUID>（启用状态；隔离同步原件另报）
      updates:
        entry: 连接 → 设置与更新 → 检查 App Store 更新、TestFlight 内测入口
        readback: ~/Dev/.venv/bin/python scripts/accept/product_basics.py --status --udid <模拟器UUID>（版本与商店渠道；实际检查见验收原件）
    inputs:
    - scripts/accept/product_basics.py
    - Sources/ProductBasicsSelfTest.swift
    - Sources/ProductSettings.swift
    - Sources/MobileProductLifecycle.swift
    - DayDeck.entitlements
  ui:
  - Sources/**
  - Shared/**
  - Watch/**
  - WatchWidget/**
  source:
  - Sources/**
  - Shared/**
  - Watch/**
  - WatchWidget/**
  - '*.entitlements'
  - Resources/**
  - project.yml
  test_inputs:
  - Tests/**
  - scripts/accept/**
  - test-contract.py
  - test_check_markdown_drift.py
  - Package.swift
  media:
  - shots
  - docs/usage-guide.md
  capture: ~/Dev/.venv/bin/python scripts/capture-demo.py --reuse-build perf/builds/current-iphone-fixture.json --in-use  # 原 sim_lane.Session；保留负载门（exit 75），不重复构建
  release: perf/asc-release.json
  site_deploy: portal  # #iphone 小节在 Notihub Mac 主页里，由门户 deploy.sh 发布（同 notifhub-bar-mac）；重测后数字变了 Chapter 自动重新部署
  measure:  # Chapter 在接电源、10 分钟无操作、负载低时自动重测；脚本自带空闲与源码快照核对，只写 perf/
    command: ~/Dev/.venv/bin/python scripts/perf/measure_platforms.py
    platform_env: SOP_PERF_PLATFORM
    outputs: [perf/simulator.json, perf/lightweight.json, perf/platforms]
    in_use: true
  runtime_note: 四条移动平台线按用户接受的模拟器范围验收，Mac 由 notifhub-bar-mac 承担；模拟器数字不代表真机。
  test: bash scripts/accept/core_tests.sh
  runtime:
    kind: ios
    readback: builtin:asc-device
  cli:  # 手机上放不了命令行：手机能看、能点的，用同族 Mac App 里的 notihub（云端同一份数据）
    commands:
    - notihub
    app: cyou.tianli.notifhubbar
  agent_cli:  # 界面功能对照（写法见 app 技能 references/agent-cli.md）；功能从界面源码逐项列出，改界面时同轮更新
    readback: notihub cloud status
    features:
    - name: 今天：未完成待办四组（逾期 / 今天 / 没定时间 / 之后）与计数
      command: notihub cloud open
    - name: 今天：搜索待办
      command: notihub cloud open
    - name: 今天：下拉刷新 / 刷新
      command: notihub cloud open
    - name: 数据陈旧度：最后同步
      command: notihub cloud status
    - name: 数据陈旧度：缓存更新
      device: 说的是这台手机上一次取到这一天并落盘的时间，缓存在手机 App 沙盒的 Application Support 里，手机不上报；notihub cloud status 给的是云端的最后同步，读不到手机上这一份缓存的时间
    - name: 待办详情（跟谁、时间、备注、佐证原文、出处、Mac 是否已推）
      command: notihub cloud open
    - name: 标为完成
      command: notihub cloud mark
    - name: 不做了
      command: notihub cloud mark
    - name: 加入提醒事项 / 仍要再加一次
      command: notihub push
    - name: 交给 Mac 存进日历/提醒事项
      command: notihub push
    - name: 排队等待 Mac 的状态
      command: notihub queue list
    - name: 本机是否已加入提醒事项（同步到 Mac 的列表）
      command: notihub cloud open
    - name: 本机是否已加入提醒事项（只在手机本机的列表）
      device: 只存在这台手机本机、不经 iCloud 同步的提醒列表；Reminders.swift 用 EventKit 只读进内存，不经 API 或 Cache，Mac 与后端没有这份列表。手机本次点击后的结果也只存在 outcomes 内存里
    - name: 通知：当天总结（标题与几条线）
      command: notihub cloud day
    - name: 通知：这天抽出来的事
      command: notihub cloud day
    - name: 通知：这天的数（通知、合并后、折叠的噪音、随手记、聊得最多）
      command: notihub cloud day
    - name: 通知：时间线（通知与云端笔记）
      command: notihub cloud day
    - name: 通知：展开正文 / 收起正文
      human: 只在窗口里有意义（展开状态；命令输出总是全文）
    - name: 通知：搜索当天通知与笔记
      command: notihub cloud day
    - name: 通知：前一天 / 后一天 / 挑一天
      command: notihub cloud days
    - name: 通知：当天的提醒事项（同步到 Mac 的列表）
      command: notihub data reminders
    - name: 通知：当天的提醒事项（只在手机本机的列表）
      device: 只存在这台手机本机、不经 iCloud 同步的提醒列表；ReminderDay.fetch 经 EventKit 查询，数据只进内存，不上传，Mac 与后端读不到
    - name: 通知：下拉刷新
      command: notihub cloud day
    - name: 随手记：写下并「记下来」
      command: notihub cloud note
    - name: 随手记：已记下的（云端笔记与 Mac 上的随手记）
      command: notihub cloud day
    - name: 随手记：草稿保存在此设备
      device: 没提交的草稿只存在这台手机的本机偏好里（diary.cloudDraft 三个键），点「记下来」之前不上传，Mac 与后端读不到；写随手记本身用 notihub cloud note
    - name: 随手记：收起键盘
      human: 只在窗口里有意义
    - name: 连接：最近同步与读取错误
      command: notihub cloud status
    - name: 连接：云端站点链接
      human: 只在窗口里有意义（打开浏览器）
    - name: 连接：访问密码登录或更新凭据
      human: 要本人在手机上输入密码，凭据只进该设备的钥匙串
    - name: 连接：提醒事项授权（允许访问 / 去设置）
      human: 系统授权弹窗只能本人点
    - name: 连接：加入到哪个提醒事项列表
      device: 这项选择只存在这台手机的本机偏好里（reminderListID，存的是手机上那个提醒列表的标识），App 不上报，也没有可迁移配置；Mac 与后端读不到也改不了。Mac 上 notihub push 写到哪个列表由 Mac 的 rules.json 决定，是另一份设置
    # 「配置与更新」面板（共享 AppLifecycleMobile）：手机端渠道是 TestFlight、没有可迁移配置（MobileProductLifecycle），
    # 三项都只在那台手机本机。Mac 上的 notihub config / update 读的是 Mac 那一份，不是这里。
    - name: 配置与更新：应用版本
      device: 显示的是这台手机上装的那一份 App 的版本与构建号（读自手机上的 App 包），手机不上报，notihub 与云端读不到
    - name: 配置与更新：更新渠道与更新状态
      device: 渠道名（TestFlight）和那句说明是编进手机 App 的固定文字，只在这台手机的面板里显示；这个渠道下 App 自己不查更新，没有可读的状态，手机也不上报
    - name: 配置与更新：检查更新 / 在 TestFlight 中检查更新
      device: 按钮只是在这台手机上跳到 TestFlight（itms-beta://），查更新和安装都由手机上的 TestFlight 完成；Mac 与云端替它点不了，也读不到结果
    - name: 标签或侧栏分区切换（今天 / 通知 / 随手记 / 连接）
      human: 只在窗口里有意义（各分区内容各有命令）
    - name: 宽屏：侧栏云端同步状态（连接是否正常、最后同步）
      command: notihub cloud status
    - name: 宽屏：侧栏「今天」角标（逾期 + 今天到期的件数）
      command: notihub cloud open
    - name: 宽屏：侧栏「通知」角标（最近一天没点开的件数）
      command: notihub cloud day
    - name: 宽屏：今天看板（待办与当天要点）
      command: notihub cloud open
    - name: 宽屏：看这天的完整时间线
      command: notihub cloud day
    - name: 手表：摘要（今日待办数、要点、从哪来）
      command: notihub cloud day
    - name: 手表：表盘复杂功能（当天未读数）
      command: notihub cloud day
    - name: 手表：多久没同步的提示
      command: notihub cloud status
    - name: 手表：主页上下翻页（未读 / 从哪来 / 要点）
      human: 只在窗口里有意义（翻页；三页内容 notihub cloud day 一次给全）
  product:
    distribution: public
    source_visibility: public
    source_url: 'https://github.com/zengtianli/notihub/tree/main/ios'
    source_of: notifhub-bar-mac
    rationale: Notihub 公开产品的 iPhone、iPad、Vision 与 Watch 客户端，与主组件 notifhub-bar-mac 共用已公开的 MIT 脱敏源码快照；匿名可访问 ios 目录，仅含程序、图标和合成测试夹具，未发现真实业务数据、密钥或联系人信息；使用者需自建云服务与自己的账号，本次只对齐分类，不发布新代码、安装包或送审。
