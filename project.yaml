name: day-deck
name_en: Notihub
name_zh: 通知复盘
display_name: Notihub · 通知复盘
family: notifhub
form: ios
platforms: [iphone, ipad, watch, vision]
lifecycle: active
bundle_id: cyou.tianli.daydeck
origin: own
sop:
  platforms:
    iphone:
      simulator: {device_type: iPhone-17-Pro}
      launch_args: [-demo, '1']
      store_shots: shots/appstore/iphone/*.png
      capture:
        command: ~/Dev/.venv/bin/python -B scripts/media/store_shots.py --platform iphone --reuse-build perf/builds/store-iphone-fixture-20261004.json --in-use
        in_use: true
        inputs: [scripts/media/store_shots.py, perf/builds/store-iphone-fixture-20261004.json]
        outputs: [shots/appstore/iphone]
      distribution: none
    ipad:
      simulator: {device_type: iPad-Pro-13-inch-M5-12GB}
      launch_args: [-demo, '1']
      orientation: landscape
      store_shots: shots/appstore/ipad/*.png
      capture:
        command: ~/Dev/.venv/bin/python -B scripts/media/store_shots.py --platform ipad --reuse-build perf/builds/store-iphone-fixture-20261004.json
        inputs: [scripts/media/store_shots.py, perf/builds/store-iphone-fixture-20261004.json]
        outputs: [shots/appstore/ipad]
      distribution: none
    mac: {component: notifhub-bar-mac}
    watch:
      scheme: DayDeckWatch
      bundle_id: cyou.tianli.daydeck.watchkitapp
      simulator: {device_type: Apple-Watch-Series-12-46mm}
      launch_args: [-demo, '1']
      store_shots: shots/appstore/watch/*.png
      budget: {memory_mb: 25, cpu: 0.5, size_mb: 10, cold_launch_ms: 1500}
      distribution: none
    vision:
      simulator: {device_type: Apple-Vision-Pro-4K}
      launch_args: [-demo, '1']
      store_shots: shots/appstore/vision/*.png
      capture:
        command: ~/Dev/.venv/bin/python -B scripts/media/store_shots.py --platform vision --reuse-build perf/builds/store-vision-fixture-20261004.json --in-use
        in_use: true
        inputs: [scripts/media/store_shots.py, perf/builds/store-vision-fixture-20261004.json]
        outputs: [shots/appstore/vision]
      budget: {memory_mb: 60, cpu: 0.5}
      distribution: none
  # 2026-09-30 核实：仓库无 ci_scripts/.github，ASC 的 Xcode Cloud 产品里没有本 bundle；推送不触发构建上传
  push_safe: true
  accept:
    functionality: bash scripts/accept/functionality.sh
    recovery: bash scripts/accept/recovery.sh
    privacy: bash scripts/accept/privacy.sh
    media_playback: builtin:media_playback
  ui:
  - Sources/**
  - Shared/**
  - Watch/**
  - WatchWidget/**
  source:
  - Sources/**
  - Shared/**
  - Watch/**
  - WatchWidget/**
  - '*.entitlements'
  - Resources/**
  - project.yml
  test_inputs:
  - Tests/**
  - scripts/accept/**
  - test-contract.py
  - test_check_markdown_drift.py
  - Package.swift
  media:
  - shots
  - docs/usage-guide.md
  capture: ~/Dev/.venv/bin/python scripts/capture-demo.py  # 自带空闲门（exit 75），只重录 shots 与说明里的画面
  release: perf/asc-release.json
  site_deploy: portal  # #iphone 小节在 Notihub Mac 主页里，由门户 deploy.sh 发布（同 notifhub-bar-mac）；重测后数字变了 Chapter 自动重新部署
  measure:  # Chapter 在接电源、10 分钟无操作、负载低时自动重测；脚本自带空闲与源码快照核对，只写 perf/
    command: ~/Dev/.venv/bin/python scripts/perf/measure_platforms.py
    platform_env: SOP_PERF_PLATFORM
    outputs: [perf/simulator.json, perf/lightweight.json, perf/platforms]
    in_use: true
  runtime_note: 四条移动平台线按用户接受的模拟器范围验收，Mac 由 notifhub-bar-mac 承担；模拟器数字不代表真机。
  test: xcrun swift test -j 2
  runtime:
    kind: ios
    readback: builtin:asc-device
  cli:  # 手机上放不了命令行：手机能看、能点的，用同族 Mac App 里的 notihub（云端同一份数据）
    commands:
    - notihub
    app: cyou.tianli.notifhubbar
  agent_cli:  # 界面功能对照（写法见 app 技能 references/agent-cli.md）；功能从界面源码逐项列出，改界面时同轮更新
    readback: notihub cloud status
    features:
    - name: 今天：未完成待办四组（逾期 / 今天 / 没定时间 / 之后）与计数
      command: notihub cloud open
    - name: 今天：搜索待办
      command: notihub cloud open
    - name: 今天：下拉刷新 / 刷新
      command: notihub cloud open
    - name: 数据陈旧度：最后同步
      command: notihub cloud status
    - name: 数据陈旧度：缓存更新
      device: 说的是这台手机上一次取到这一天并落盘的时间，缓存在手机 App 沙盒的 Application Support 里，手机不上报；notihub cloud status 给的是云端的最后同步，读不到手机上这一份缓存的时间
    - name: 待办详情（跟谁、时间、备注、佐证原文、出处、Mac 是否已推）
      command: notihub cloud open
    - name: 标为完成
      command: notihub cloud mark
    - name: 不做了
      command: notihub cloud mark
    - name: 加入提醒事项 / 仍要再加一次
      command: notihub push
    - name: 交给 Mac 存进日历/提醒事项
      command: notihub push
    - name: 排队等待 Mac 的状态
      command: notihub queue list
    - name: 本机是否已加入提醒事项
      missing: notihub 没有按待办查它是否已在提醒事项里的读命令（push 只写、targets 只列列表）。手机加入时在提醒的备注末行写 notihub:agenda/<键>，列表经 iCloud 同步到 Mac 后在 notihub data reminders 的备注一列看得到，但要自己算键比对；需要 notihub 的 cloud open 或 agenda 在 --json 里带上「已在提醒事项」。手机这一行本身是本次运行里点「加入」的结果，只在内存里
    - name: 通知：当天总结（标题与几条线）
      command: notihub cloud day
    - name: 通知：这天抽出来的事
      command: notihub cloud day
    - name: 通知：这天的数（通知、合并后、折叠的噪音、随手记、聊得最多）
      command: notihub cloud day
    - name: 通知：时间线（通知与云端笔记）
      command: notihub cloud day
    - name: 通知：展开正文 / 收起正文
      human: 只在窗口里有意义（展开状态；命令输出总是全文）
    - name: 通知：搜索当天通知与笔记
      command: notihub cloud day
    - name: 通知：前一天 / 后一天 / 挑一天
      command: notihub cloud days
    - name: 通知：当天的提醒事项（仅本机）
      missing: 手机读的是它本机的提醒事项，App 不上传。经 iCloud 同步到 Mac 的列表，notihub data reminders 读得到标题、清单、状态、截止与备注，但没有完成时间，也不能按天取；需要 notihub data reminders 加完成时间一列和按日期筛选。只存在手机本机列表里的提醒 Mac 读不到
    - name: 通知：下拉刷新
      command: notihub cloud day
    - name: 随手记：写下并「记下来」
      command: notihub cloud note
    - name: 随手记：已记下的（云端笔记与 Mac 上的随手记）
      command: notihub cloud day
    - name: 随手记：草稿保存在此设备
      device: 没提交的草稿只存在这台手机的本机偏好里（diary.cloudDraft 三个键），点「记下来」之前不上传，Mac 与后端读不到；写随手记本身用 notihub cloud note
    - name: 随手记：收起键盘
      human: 只在窗口里有意义
    - name: 连接：最近同步与读取错误
      command: notihub cloud status
    - name: 连接：云端站点链接
      human: 只在窗口里有意义（打开浏览器）
    - name: 连接：访问密码登录或更新凭据
      human: 要本人在手机上输入密码，凭据只进该设备的钥匙串
    - name: 连接：提醒事项授权（允许访问 / 去设置）
      human: 系统授权弹窗只能本人点
    - name: 连接：加入到哪个提醒事项列表
      device: 这项选择只存在这台手机的本机偏好里（reminderListID，存的是手机上那个提醒列表的标识），App 不上报，也没有可迁移配置；Mac 与后端读不到也改不了。Mac 上 notihub push 写到哪个列表由 Mac 的 rules.json 决定，是另一份设置
    # 「配置与更新」面板（共享 AppLifecycleMobile）：手机端渠道是 TestFlight、没有可迁移配置（MobileProductLifecycle），
    # 三项都只在那台手机本机。Mac 上的 notihub config / update 读的是 Mac 那一份，不是这里。
    - name: 配置与更新：应用版本
      device: 显示的是这台手机上装的那一份 App 的版本与构建号（读自手机上的 App 包），手机不上报，notihub 与云端读不到
    - name: 配置与更新：更新渠道与更新状态
      device: 渠道名（TestFlight）和那句说明是编进手机 App 的固定文字，只在这台手机的面板里显示；这个渠道下 App 自己不查更新，没有可读的状态，手机也不上报
    - name: 配置与更新：检查更新 / 在 TestFlight 中检查更新
      device: 按钮只是在这台手机上跳到 TestFlight（itms-beta://），查更新和安装都由手机上的 TestFlight 完成；Mac 与云端替它点不了，也读不到结果
    - name: 标签或侧栏分区切换（今天 / 通知 / 随手记 / 连接）
      human: 只在窗口里有意义（各分区内容各有命令）
    - name: 宽屏：侧栏云端同步状态（连接是否正常、最后同步）
      command: notihub cloud status
    - name: 宽屏：侧栏「今天」角标（逾期 + 今天到期的件数）
      command: notihub cloud open
    - name: 宽屏：侧栏「通知」角标（最近一天没点开的件数）
      command: notihub cloud day
    - name: 宽屏：今天看板（待办与当天要点）
      command: notihub cloud open
    - name: 宽屏：看这天的完整时间线
      command: notihub cloud day
    - name: 手表：摘要（今日待办数、要点、从哪来）
      command: notihub cloud day
    - name: 手表：表盘复杂功能（当天未读数）
      command: notihub cloud day
    - name: 手表：多久没同步的提示
      command: notihub cloud status
    - name: 手表：主页上下翻页（未读 / 从哪来 / 要点）
      human: 只在窗口里有意义（翻页；三页内容 notihub cloud day 一次给全）
  product:
    distribution: personal
    source_visibility: private
    source_url: ''
    rationale: 自用 Notihub 手机端用于随身查看本人通知摘要、待办与随手记；当前产品目录明确不提供下载。
